# Fly.io configuration for the Open Spaces display + attendee app.
#
# This is a static SPA behind nginx; all state lives in Supabase, so there is
# nothing to persist here and machines are disposable.

app            = 'dcsots-open-spaces'
primary_region = 'iad'   # Ashburn, VA -- the closest region to the venue in DC

[build]
  # Build args are supplied by the deploy workflow; see .github/workflows/deploy.yml

[http_service]
  internal_port = 8080
  force_https   = true

  # Deliberately NOT auto-stopping. A cold start in front of a live audience is
  # not acceptable, and two always-on shared-cpu machines cost a couple of
  # dollars for the week.
  auto_stop_machines   = 'off'
  auto_start_machines  = true
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = '5s'
    interval     = '15s'
    method       = 'GET'
    path         = '/healthz'
    timeout      = '2s'

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '256mb'

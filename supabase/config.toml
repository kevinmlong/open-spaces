project_id = "open-spaces"

# NOTE: this project runs on 544xx rather than the Supabase defaults (543xx)
# because another local Supabase project already occupies those ports. Keep them
# distinct so both stacks can run side by side.

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
# Off by default to keep the local stack light -- this project is developed
# against psql and the scripts in scripts/, so Studio is a spare container.
# Flip to true (and `supabase stop && supabase start`) if you want the web UI.
enabled = false
port = 54423
api_url = "http://127.0.0.1"

[local_smtp]
# Off: there is no email in this app. Organizer accounts are created by hand and
# confirmations are disabled, so nothing ever sends mail to catch.
enabled = false
port = 54424

[storage]
enabled = false

[auth]
enabled = true
# The public address we hand to attendees, and what password-reset links point
# at. The fly.dev origin stays in the redirect list because the app is still
# reachable there (and would be the fallback if DNS misbehaved on the day);
# localhost keeps local development working.
site_url = "https://openspaces.dcstateofthestack.org"
additional_redirect_urls = [
  "https://openspaces.dcstateofthestack.org",
  "https://dcsots-open-spaces.fly.dev",
  "http://localhost:5173",
]

# A full day, so no token refresh is needed during a two-hour session on flaky
# venue wifi.
jwt_expiry = 86400
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# THE critical flag: attendees never log in.
enable_anonymous_sign_ins = true

# MUST stay true. GOTRUE_DISABLE_SIGNUP also blocks signInAnonymously(), so
# turning signup off here would lock every attendee out of the app -- which is
# the entire product. Anyone can therefore create an account, and that is fine:
# a self-created account is exactly as powerless as an anonymous one, because
# authority comes from profiles.is_admin, which has no self-UPDATE policy and is
# set by hand. scripts/e2e-lifecycle.mjs asserts that property directly.
enable_signup = true

[auth.email]
# Careful: the CLI derives GOTRUE_EXTERNAL_EMAIL_ENABLED from THIS enable_signup,
# not from `enabled`. Setting it false switches the email provider off entirely
# and organizers cannot sign in at all.
#
# So the provider stays on here, and self-service signup is blocked by the
# top-level [auth] enable_signup = false (GOTRUE_DISABLE_SIGNUP=true) instead.
# Verified by scripts/e2e-lifecycle.mjs, which asserts signUp() is rejected.
enabled = true
enable_signup = true
enable_confirmations = false
double_confirm_changes = false

[auth.rate_limit]
# The entire conference sits behind the venue's single NAT IP. Supabase's default
# anonymous sign-in limit (~30/hour/IP) would lock out the room within minutes of
# opening proposals. This sets the LOCAL limit; the hosted project has its own
# setting in the dashboard (Auth -> Rate Limits) that must be raised separately --
# see the README pre-flight checklist.
anonymous_users = 3000

[analytics]
# Off: this app has no use for Logflare analytics, and its default port (54327)
# collides with the other local Supabase project. One less container to run.
enabled = false

[edge_runtime]
# No Edge Functions in this project -- deduplication is manual and there is no
# server-side AI call, so there is nothing for the runtime to host.
enabled = false
